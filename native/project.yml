name: bzpad

options:
  bundleIdPrefix: com.buragc
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  EisenhowerCore:
    path: EisenhowerCore

targets:

  # ── iOS ────────────────────────────────────────────────────
  bzpad-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.buragc.bzpad
    sources:
      - path: bzpad/Sources/Shared
        createIntermediateGroups: true
      - path: bzpad/Sources/iOS
        createIntermediateGroups: true
    dependencies:
      - package: EisenhowerCore
    info:
      path: bzpad/Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: bzpad
        # iOS 17+ requestFullAccessToReminders() requires this key (distinct from NSRemindersUsageDescription)
        NSRemindersFullAccessUsageDescription: "bzpad stores your tasks in Reminders so they sync across all your devices via iCloud."
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_NAME: bzpad

  # ── macOS ───────────────────────────────────────────────────
  bzpad-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    bundleId: com.buragc.bzpad.mac
    sources:
      - path: bzpad/Sources/Shared
        createIntermediateGroups: true
      - path: bzpad/Sources/macOS
        createIntermediateGroups: true
    dependencies:
      - package: EisenhowerCore
    info:
      path: bzpad/Sources/macOS/Info.plist
      properties:
        CFBundleDisplayName: bzpad
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSRemindersUsageDescription: "bzpad uses Reminders to store and sync your tasks via iCloud."
    entitlements:
      path: bzpad/Sources/macOS/bzpad.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_NAME: bzpad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ── Unit Tests ──────────────────────────────────────────────
  EisenhowerCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    bundleId: com.buragc.EisenhowerCoreTests
    sources:
      - path: EisenhowerCore/Tests/EisenhowerCoreTests
    dependencies:
      - package: EisenhowerCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
