[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bzpad-tui"
version = "0.1.0"
description = "Terminal UI for Eisenhower matrix task management via Todoist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.52.0",
    "httpx>=0.27.0",
]

[project.scripts]
bzpad = "bzpad.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bzpad"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.29.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
